<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" role="img" aria-label="HAND-32 DuPont wiring">
  <rect width="1280" height="900" fill="#0f1410"/>
  <text x="40" y="32" fill="#d4e8c8" font-family="ui-monospace,Consolas,monospace" font-size="18" font-weight="700">HAND-32  |  DuPont harness</text>
  <text x="40" y="50" fill="#7a8f74" font-family="ui-monospace,Consolas,monospace" font-size="12">11× 6×6 tactiles on Perma-Proto half. Opposite corners. Other side GND.</text>
  <g font-family="ui-sans-serif,Segoe UI,sans-serif">
    <rect x="28" y="66" width="200" height="100" rx="10" fill="#1e2a1c" stroke="#6a8f4e" stroke-width="2"/>
    <text x="128" y="88" text-anchor="middle" fill="#c6e6a8" font-size="13" font-weight="700">Nulllabs LiPo pack</text>
    <text x="44" y="118" fill="#e23b2e" font-size="12">5V</text>
    <text x="44" y="136" fill="#f0a020" font-size="12">3V3</text>
    <text x="44" y="154" fill="#c8c8c8" font-size="12">GND</text>
    <rect x="244" y="66" width="250" height="100" rx="10" fill="#1e2a1c" stroke="#6a8f4e" stroke-width="2"/>
    <text x="369" y="88" text-anchor="middle" fill="#c6e6a8" font-size="13" font-weight="700">HiLetgo S3 N16R8</text>
    <text x="260" y="118" fill="#d4c018" font-size="11">12 11 13 SPI   10 4 CS</text>
    <text x="260" y="136" fill="#3a7bd4" font-size="11">41 42 40 I2S</text>
    <text x="260" y="154" fill="#d0d0d0" font-size="11">GPIO pad 1 2 7 8 15-18 5 6 39</text>
    <rect x="510" y="66" width="220" height="100" rx="10" fill="#1e2a1c" stroke="#6a8f4e" stroke-width="2"/>
    <text x="620" y="88" text-anchor="middle" fill="#c6e6a8" font-size="13" font-weight="700">Waveshare 2in</text>
    <text x="526" y="118" fill="#f0a020" font-size="11">3V3 (VCC=NC)</text>
    <text x="526" y="136" fill="#d4c018" font-size="11">SCLK MOSI MISO CS DC RST BL</text>
    <text x="526" y="154" fill="#6a4a4a" font-size="11">TP_* NC</text>
    <rect x="746" y="66" width="502" height="100" rx="10" fill="#1e2a1c" stroke="#d0d0d0" stroke-width="2"/>
    <text x="997" y="88" text-anchor="middle" fill="#c6e6a8" font-size="13" font-weight="700">GPIO tactile pad</text>
    <text x="762" y="118" fill="#d0d0d0" font-size="11">U1 D2 L7 R8   A15 B16 X17 Y18</text>
    <text x="762" y="136" fill="#d0d0d0" font-size="11">Start 5   Select 6   Menu 39</text>
    <text x="762" y="154" fill="#7a8f74" font-size="11">Perma-Proto half  |  opposite corners to GND rail</text>
  </g>
  <g font-family="ui-sans-serif,Segoe UI,sans-serif">
    <rect x="28" y="184" width="1224" height="150" rx="12" fill="#1a2218" stroke="#e07a32" stroke-width="2"/>
    <text x="44" y="208" fill="#e07a32" font-size="14" font-weight="700">Nulllabs NS4168 3W Audio amp w/Speaker</text>
    <rect x="48" y="220" width="200" height="94" rx="10" fill="#d96a28"/>
    <rect x="58" y="232" width="180" height="70" rx="6" fill="#1c2834"/>
    <text x="148" y="258" text-anchor="middle" fill="#e8d8b0" font-size="11" font-weight="700">NS4168 I2S DAC AMP</text>
    <text x="70" y="278" fill="#8ab4e8" font-size="10">G V BCL LRC DIN</text>
    <text x="70" y="292" fill="#e23b2e" font-size="10">+ / - speaker</text>
    <line x1="256" y1="250" x2="380" y2="250" stroke="#e23b2e" stroke-width="4"/>
    <line x1="256" y1="268" x2="380" y2="268" stroke="#c8c8c8" stroke-width="4"/>
    <text x="268" y="242" fill="#e23b2e" font-size="11">red +</text>
    <text x="268" y="286" fill="#c8c8c8" font-size="11">black -</text>
    <rect x="380" y="220" width="90" height="94" rx="8" fill="#1a1a1a" stroke="#888"/>
    <circle cx="425" cy="267" r="26" fill="#3a3a3a" stroke="#888"/>
    <circle cx="425" cy="267" r="14" fill="#c8c8c8"/>
    <circle cx="425" cy="267" r="5" fill="#eee"/>
    <text x="490" y="258" fill="#c6e6a8" font-size="13" font-weight="700">3 W speaker</text>
    <text x="490" y="278" fill="#7a8f74" font-size="11">2-wire on the amp. Not a GPIO.</text>
    <text x="490" y="296" fill="#7a8f74" font-size="11">41 BCL  42 LRC  40 DIN</text>
  </g>
  <g font-family="ui-monospace,Consolas,monospace" font-size="13">
    <text x="40" y="364" fill="#9db88e" font-weight="700">1 POWER     2 SPI2     3 GPIO PAD     4 I2S     5 SPEAKER</text>
    <rect x="40" y="376" width="1200" height="36" rx="8" fill="#161c14" stroke="#2c3a28"/>
    <text x="56" y="400" fill="#e8d0cc">Pack 5V - DevKit 5V + amp V.  Pack 3V3 - LCD 3V3.  Star GND.  LCD VCC NC.</text>
    <rect x="40" y="422" width="1200" height="36" rx="8" fill="#161c14" stroke="#2c3a28"/>
    <text x="56" y="446" fill="#d4c018">12 SCLK  11 MOSI  13 MISO  10 LCD_CS  4 SD_CS  14 DC  9 RST  21 BL</text>
    <rect x="40" y="468" width="1200" height="36" rx="8" fill="#161c14" stroke="#2c3a28"/>
    <text x="56" y="492" fill="#d0d0d0">1 U  2 D  7 L  8 R  15 A  16 B  17 X  18 Y  5 Start  6 Select  39 Menu  — each to GND rail</text>
    <rect x="40" y="514" width="580" height="36" rx="8" fill="#161c14" stroke="#2c3a28"/>
    <text x="56" y="538" fill="#3a7bd4">41 BCL  42 LRC  40 DIN</text>
    <rect x="640" y="514" width="600" height="36" rx="8" fill="#161c14" stroke="#2c3a28"/>
    <text x="656" y="538" fill="#e8d0cc">Amp + red / - black to speaker</text>
  </g>
  <text x="40" y="580" fill="#7a8f74" font-family="ui-monospace,Consolas,monospace" font-size="12">Never: 0 3 19 20 26-37 43-46 47 48. Unplug pack 5V while UART USB-C is plugged in.</text>
  <text x="40" y="604" fill="#4a5c46" font-family="ui-monospace,Consolas,monospace" font-size="11">hiletgo-ws2-ns4168  |  Retro-Go by ducalex  |  wilcox101-maker/HAND-32</text>
</svg>
